name: CodeQL Analysis

# PUBLIC CI SHIM — this file runs in salahAlssayani/rizq-ci (public repo).
# SOURCE OF TRUTH (edit there, never here directly):
#   salahAlssayani/rizq-saas-v1 -> ci-shim/.github/workflows/codeql.yml
# Sync:   node scripts/sync-ci-shim.mjs          (from the private repo)
# Trigger: gh workflow run codeql.yml -R salahAlssayani/rizq-ci
#          (or wait for the weekly Monday 05:00 UTC schedule)
# Spec, deltas, security notes: ci-shim/README.md
#
# WHY THIS EXISTS (P2, session-165, COM-01): the native private-repo CodeQL
# workflow failed with "Resource not accessible by integration" since
# 2026-09-21 — GitHub CodeQL needs GHAS on a PRIVATE repo, which this
# account does not have. Public repos get CodeQL for free, so the analysis
# is moved here: checkout the private code with the fine-grained PAT
# (secret PRIVATE_REPO_TOKEN, Contents: Read on rizq-saas-v1 only).
# NEVER add other secrets to this public repo.
#
# SHIM DELTAS vs .github/workflows/codeql.yml (rationale in ci-shim/README.md):
#   1. triggers: workflow_dispatch + weekly schedule — a public repo cannot
#      see the private repo's push/pull_request events
#   2. every actions/checkout pins repository/ref/token (the PAT)
#   3. permissions KEEP security-events: write (deliberate inversion of the
#      security.yml delta): SARIF is uploaded to THIS repo's Security tab.
#      SECURITY NOTE (user-accepted, session-165): alert messages + file
#      paths/lines of the private codebase become visible in a PUBLIC
#      Security tab. Source snippets are not rendered (the analysed files
#      are not committed to this repo), but messages may quote small code
#      fragments. This exposure was explicitly accepted by the repo owner
#      on 2026-10-16; do not re-deny without a COM-01 question.
#   4. setup-go step added before autobuild (Go extraction needs a go
#      toolchain; the native runner image drifts)
#   5. analyze runs with upload:false + a REST upload step — the built-in
#      upload 404s with "commit not found" because the workspace HEAD is
#      the PRIVATE repo's develop SHA, which does not exist in this repo.
#      The REST call attaches the SARIF to rizq-ci's main HEAD instead
#      (run 38912503032 proved analysis+export fine, upload 404).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'  # Weekly Monday 5am UTC (native was 04:00; shim security.yml is 02:00)

permissions:
  contents: read
  security-events: write  # DELTA: kept on purpose — see header note 3

env:
  SOURCE_REPO: salahAlssayani/rizq-saas-v1

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript']

    steps:
      - uses: actions/checkout@v4
        with:
          repository: salahAlssayani/rizq-saas-v1
          ref: develop
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: false  # SHIM DELTA 5: built-in upload 404s (private SHA not in this repo)

      - name: Upload SARIF to rizq-ci Security tab (commit mapped to main HEAD)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          # REST upload requires gzip-then-base64 (NOT the raw file) and has
          # NO category param — analyze already embedded the category in the
          # SARIF. Evidence: run 38915738216 analysis OK, upload 422
          # ("category" not a permitted key); run 38922186919 analysis OK,
          # jq --arg dies "Argument list too long" (SARIF > argv limit) —
          # base64 needs no JSON escaping, so printf straight to the body file.
          SARIF_B64=$(gzip -c "$GITHUB_WORKSPACE/../results/${{ matrix.language }}.sarif" | base64 -w0)
          printf '{"commit_sha":"%s","ref":"refs/heads/main","checkout_uri":"https://github.com/%s","tool_name":"CodeQL","sarif":"%s"}' \
            "$SHA" "${{ github.repository }}" "$SARIF_B64" > /tmp/sarif-upload.json
          gh api -X POST "repos/${{ github.repository }}/code-scanning/sarifs" \
            --input /tmp/sarif-upload.json \
            --jq '.id,.url'
          echo "SARIF uploaded for ${{ matrix.language }} at rizq-ci@$SHA"
